  html,body{margin:0;padding:0;height:100%;background:#04131b;color:#eafcff;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  .cd-bootfail{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#04131b;}
  .cd-bootfail p{max-width:40em;margin:0;opacity:0.85;}
  .cd-bootfail button{padding:12px 22px;font:inherit;color:#eafcff;background:rgba(79,216,194,0.12);border:1px solid rgba(79,216,194,0.55);border-radius:10px;cursor:pointer;}
</style>
<script>
  // Boot watchdog: a game that never draws its title screen must say so instead
  // of sitting on a dark page. Cleared by app.js once the UI is built.
  (function () {
    var failed = false;
    function tr(k, v) { return window.CDI18N ? window.CDI18N.T(k, v) : k.replace('{reason}', v ? v.reason : ''); }
    function fail(reason) {
      if (failed || document.body.getAttribute('data-cd-booted')) return;
      failed = true;
      var box = document.createElement('section');
      box.className = 'cd-bootfail';
      box.setAttribute('role', 'alert');
      var T = function (k, v) { return window.CDI18N ? window.CDI18N.T(k, v) : k.replace('{reason}', v ? v.reason : ''); };
      var h2 = document.createElement('h2'), p1 = document.createElement('p'), p2 = document.createElement('p');
      h2.textContent = T('Cellular Drift could not start');
      p1.textContent = reason;
      p2.textContent = T('Reload to fetch a fresh copy. If it keeps happening, your browser may be blocking modern JavaScript modules or WebGL.');
      box.appendChild(h2); box.appendChild(p1); box.appendChild(p2);
      var btn = document.createElement('button');
      btn.textContent = T('Reload');
      btn.addEventListener('click', function () { location.reload(); });
      box.appendChild(btn);
      document.body.appendChild(box);
    }
    window.__cdBootFail = fail;
    window.addEventListener('error', function (e) {
      if (e && e.message) fail(tr('A script failed to load or run: {reason}', { reason: e.message }));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      fail(tr('Startup failed: {reason}', { reason: r && r.message ? r.message : String(r) }));
    });
    window.addEventListener('load', function () {
      setTimeout(function () { fail(tr('The game did not finish loading in time (a script or the 3D renderer is missing or blocked).')); }, 8000);
    });
  })();
</script>
